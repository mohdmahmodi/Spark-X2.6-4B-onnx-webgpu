<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <title>Spark-X2.6-4B</title>
    <meta name="description" content="Chat with Spark-X2.6-4B running entirely in your browser on WebGPU." />
    <!-- Model folder. Without a local build the page falls back to the published Hugging Face repository;
         tools/make_space.py points hosted copies straight at the Hub. -->
    <meta name="spark-model" content="./spark" data-fallback="https://huggingface.co/mohdmahmodi/Spark-X2.6-4B-ONNX-WebGPU/resolve/main" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="assets/base.css" />
    <link rel="stylesheet" href="assets/chat.css" />
    <script type="importmap">
      {
        "imports": {
          "onnxruntime-web/webgpu": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.0-dev.20260918-bc8e7ed75/dist/ort.webgpu.min.mjs",
          "@huggingface/tokenizers": "https://cdn.jsdelivr.net/npm/@huggingface/tokenizers@0.2.0/dist/tokenizers.min.mjs",
          "@huggingface/jinja": "https://cdn.jsdelivr.net/npm/@huggingface/jinja@0.5.10/dist/index.js",
          "marked": "https://cdn.jsdelivr.net/npm/marked@18.1.1/lib/marked.esm.js",
          "dompurify": "https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.es.mjs"
        }
      }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js" data-manual></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script type="module" src="app/main.js"></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="side">
        <button class="side-row" id="new" type="button"><svg class="icon"><use href="assets/icons.svg#square-pen" /></svg>New chat</button>
        <a class="side-row" href="benchmarks.html"><svg class="icon"><use href="assets/icons.svg#gauge" /></svg>Benchmarks</a>
        <nav class="chat-list" id="list" aria-label="Chats"></nav>
        <div class="side-foot">
          <div class="device" id="device">Starting</div>
          <dl class="stats">
            <dt>Load</dt><dd id="s-load">–</dd>
            <dt>First token</dt><dd id="s-ttft">–</dd>
            <dt>Decode</dt><dd id="s-tps">–</dd>
            <dt>Tokens</dt><dd id="s-tokens">–</dd>
          </dl>
          <div class="foot-links">
            <a href="https://github.com/mohdmahmodi/Spark-X2.6-4B-onnx-webgpu" target="_blank" rel="noopener" title="Source on GitHub" aria-label="Source on GitHub">
              <svg class="icon"><use href="assets/icons.svg#github" /></svg></a>
            <a href="https://huggingface.co/mohdmahmodi/Spark-X2.6-4B-ONNX-WebGPU" target="_blank" rel="noopener" title="Model on Hugging Face" aria-label="Model on Hugging Face">
              <svg class="icon"><use href="assets/icons.svg#huggingface" /></svg></a>
            <a href="https://x.com/mohdmahmodi" target="_blank" rel="noopener" title="@mohdmahmodi on X" aria-label="@mohdmahmodi on X">
              <svg class="icon"><use href="assets/icons.svg#brand-x" /></svg></a>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="menu-btn" id="menu" type="button" aria-label="Show chats"><svg class="icon-lg"><use href="assets/icons.svg#menu" /></svg></button>
          <span class="model-name" id="model-name">Spark-X2.6-4B</span>
          <span class="model-format">WebGPU</span>
          <span class="status" id="status">Checking WebGPU</span>
        </header>
        <div class="progress" id="bar" hidden><span></span></div>
        <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>
        <div class="composer">
          <div class="composer-box">
            <textarea id="prompt" rows="1" placeholder="Ask anything" aria-label="Message"></textarea>
            <div class="controls">
              <label class="chip" title="Reason step by step before answering">
                <input type="checkbox" id="thinking" /><svg class="icon"><use href="assets/icons.svg#brain" /></svg>Think
              </label>
              <select class="chip-select" id="effort" aria-label="Reasoning effort" hidden>
                <option value="high">High effort</option>
                <option value="low">Low effort</option>
              </select>
              <span class="spacer"></span>
              <button class="icon-btn" id="settings-btn" type="button" aria-label="Generation settings" aria-expanded="false" aria-controls="settings">
                <svg class="icon"><use href="assets/icons.svg#sliders-horizontal" /></svg></button>
              <button class="stop-btn" id="stop" type="button" hidden aria-label="Stop"><svg class="icon"><use href="assets/icons.svg#square" /></svg></button>
              <button class="send-btn" id="go" type="button" disabled aria-label="Send"><svg class="icon"><use href="assets/icons.svg#arrow-up" /></svg></button>
            </div>
            <div class="settings" id="settings" hidden>
              <label>Temperature <input type="number" id="temp" value="1.0" min="0" max="2" step="0.1" /></label>
              <label>Max new tokens <input type="number" id="max" value="2048" min="1" max="30000" /></label>
            </div>
          </div>
          <p class="hint">Runs on your GPU. Nothing you type leaves this device.</p>
        </div>
      </main>
    </div>
  </body>
</html>
